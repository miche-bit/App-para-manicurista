<title>Panel del Estudio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Figtree:wght@400;600;700&display=swap">
<link rel="stylesheet" href="design.css">
<style>
  .wrap { max-width: 800px; margin: 0 auto; padding-inline: var(--sp-4); }
  main.wrap, .panel-in { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); min-width: 0; }
  main.wrap { padding-block: var(--sp-4) var(--sp-7); }
  .panel-in:focus { outline: none; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding-block: var(--sp-4); flex-wrap: wrap; }
  .top h1 { font-size: var(--fs-xl); font-style: italic; font-weight: 500; }
  .tabs { position: relative; display: flex; gap: var(--sp-1); overflow-x: auto; border-bottom: 1px solid var(--c-line); scrollbar-width: none; scroll-behavior: smooth; }
  .tabs::-webkit-scrollbar { display: none; }
  @media (max-width: 700px) { .tabs { mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); padding-right: 28px; } }
  .tabs button { min-height: var(--tap); padding: 0 var(--sp-4); border: 0; background: none; color: var(--c-muted); font: 600 var(--fs-sm) var(--f-body); cursor: pointer; white-space: nowrap; transition: color var(--dur); }
  .tabs button[aria-selected="true"] { color: var(--c-ink); }
  .tabs .ind { position: absolute; bottom: 0; left: 0; height: 3px; border-radius: 3px; background: var(--c-accent); transition: transform 480ms var(--ease-spring), width 480ms var(--ease-spring); }
  .badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--c-accent); color: var(--c-accent-ink); font-size: 12px; animation: pop 500ms var(--ease-spring); }
  h2.h { font-size: var(--fs-lg); }
  .card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-md); padding: var(--sp-4); display: grid; gap: var(--sp-3); }
  .row { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
  .row.between { justify-content: space-between; }
  .grid2 { display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .list { display: grid; gap: var(--sp-3); }
  .seg { display: inline-flex; flex-wrap: nowrap; max-width: 100%; overflow-x: auto; scrollbar-width: none; border: 1.5px solid var(--c-line); border-radius: var(--r-pill); padding: 3px; gap: 2px; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: none; white-space: nowrap; min-height: 40px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-pill); background: none; color: var(--c-ink); font: 600 var(--fs-xs) var(--f-body); cursor: pointer; transition: background var(--dur), color var(--dur); }
  .seg button[aria-pressed="true"] { background: var(--c-ink); color: var(--c-bg); }
  .kpis { display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .kpi { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-md); padding: var(--sp-4); display: grid; gap: 2px; }
  .kpi strong { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.1; }
  .kpi.hl { background: var(--c-ink); color: var(--c-bg); border-color: var(--c-ink); }
  .kpi.hl .muted { color: color-mix(in srgb, var(--c-bg) 70%, transparent); }
  .meter { height: 6px; border-radius: 6px; background: var(--c-skel); overflow: hidden; margin-top: var(--sp-2); }
  .meter i { display: block; height: 100%; width: var(--v); background: var(--c-accent); border-radius: 6px; animation: grow 1s var(--ease-out) 200ms backwards; }
  @keyframes grow { from { width: 0; } }
  .timeline { display: grid; gap: 0; }
  .timeline .t { display: grid; grid-template-columns: 6.4em minmax(0, 1fr) auto; gap: var(--sp-3); align-items: center; padding-block: var(--sp-2); border-top: 1px solid var(--c-line); }
  .timeline .t:first-child { border-top: 0; }
  .timeline .t > strong, .slot-row strong { white-space: nowrap; }
  .booking-when { font-family: var(--f-display); font-size: var(--fs-lg); font-weight: 600; }
  .note { font-size: var(--fs-sm); background: var(--c-bg); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); }
  .day-block h3 { font-family: var(--f-body); font-size: var(--fs-md); font-weight: 700; }
  .booking-when::first-letter, .day-block h3::first-letter { text-transform: uppercase; }
  .slot-row { display: grid; grid-template-columns: 6.4em minmax(0, 1fr) auto; gap: var(--sp-2); align-items: center; padding-block: var(--sp-2); border-top: 1px solid var(--c-line); }
  .weekdays { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .weekdays label { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0 var(--sp-3); border: 1.5px solid var(--c-line); border-radius: var(--r-pill); cursor: pointer; font-size: var(--fs-sm); transition: border-color var(--dur), background var(--dur); }
  .weekdays label:has(input:checked) { border-color: var(--c-accent); background: var(--c-accent-soft); }
  .weekdays input, .check input { width: 22px; height: 22px; flex: none; accent-color: var(--c-accent); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--sp-3); }
  .thumb { display: grid; gap: var(--sp-1); font-size: var(--fs-sm); }
  .thumb .ph { aspect-ratio: 1; max-width: 100%; border-radius: var(--r-sm); overflow: hidden; background: var(--c-skel); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .login { max-width: 400px; margin: 12vh auto 0; }
  .login h1 { font-size: var(--fs-2xl); font-style: italic; font-weight: 500; }
  .preview { width: 120px; aspect-ratio: 1; border-radius: var(--r-sm); object-fit: cover; animation: pop 400ms var(--ease-spring); }
  .check { display: flex; gap: var(--sp-2); align-items: center; min-height: var(--tap); }
  .hours-edit { display: grid; }
  .hours-edit .hrow { display: grid; gap: var(--sp-2); padding-block: var(--sp-3); border-top: 1px solid var(--c-line); }
  .hours-edit .hrow:first-child { border-top: 0; padding-top: 0; }
  .hours-edit .hday { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
  .hours-edit .times { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); transition: opacity var(--dur); }
  .hours-edit .times label { display: grid; gap: 2px; font-size: var(--fs-xs); font-weight: 600; color: var(--c-muted); }
  .hours-edit .times .input { width: 100%; min-width: 0; }
  .hours-edit .hrow:has([data-h-ab]:not(:checked)) .times { opacity: .45; }
  .map-prev { aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--c-line); background: var(--c-skel); }
  .map-prev { position: relative; }
  .map-prev .leaflet-container { position: absolute; inset: 0; width: 100%; height: 100%; font: inherit; }
  .map-prev.alto { aspect-ratio: 4 / 3.2; }
  .pin-l svg { width: 34px; height: 44px; filter: drop-shadow(0 4px 6px rgb(0 0 0 / .3)); }
  .credito { font-size: var(--fs-xs); color: var(--c-muted); text-align: center; display: grid; gap: 2px; padding-block: var(--sp-5); }
  .credito a { color: var(--c-muted); display: inline-flex; align-items: center; justify-self: center; min-height: var(--tap); padding-inline: var(--sp-2); }
  .faq-item { display: grid; gap: var(--sp-2); padding: var(--sp-3); border: 1px solid var(--c-line); border-radius: var(--r-sm); animation: fade-up var(--dur) var(--ease-out); }
  .stars-s { color: var(--c-gloss); letter-spacing: 1px; }
  .stagger-in > * { animation: fade-up var(--dur-slow) var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * var(--stagger)); }
  .sub { font-size: var(--fs-sm); font-weight: 700; }
</style>

<a class="skip-link" href="#contenido">Saltar al contenido</a>
<div id="app"></div>
<div class="sr-only" aria-live="polite" id="live"></div>
<div class="toast" id="toast" role="status" hidden></div>

<dialog class="sheet" id="compDialog" aria-labelledby="compTitle">
  <div class="sheet-head"><h2 id="compTitle" style="font-size:var(--fs-lg)">Comprobante</h2><button class="icon-btn" type="button" data-close aria-label="Cerrar">×</button></div>
  <div class="sheet-body" id="compBody"></div>
</dialog>

<dialog class="sheet" id="cardDialog" aria-labelledby="cardTitle">
  <div class="sheet-head"><h2 id="cardTitle" style="font-size:var(--fs-lg)">Tarjeta</h2><button class="icon-btn" type="button" data-close aria-label="Cerrar">×</button></div>
  <form class="sheet-body" id="cardForm" novalidate></form>
</dialog>

<dialog class="sheet" id="svcDialog" aria-labelledby="svcTitle">
  <div class="sheet-head"><h2 id="svcTitle" style="font-size:var(--fs-lg)">Servicio</h2><button class="icon-btn" type="button" data-close aria-label="Cerrar">×</button></div>
  <form class="sheet-body" id="svcForm" novalidate></form>
</dialog>

<script>
(() => {
  'use strict';
  document.documentElement.lang = 'es';
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const S = { token: null, data: null, tab: 'agenda', filtroRes: 'pendiente', cat: 'precios', filtroResena: 'pendiente', editSvc: null, foto: null };
  try { S.token = localStorage.getItem('estudio_token'); } catch {}

  const ESTADO = { pendiente: ['Pendiente', 'pill-warn'], confirmada: ['Confirmada', 'pill-ok'], cancelada: ['Cancelada', 'pill-muted'], completada: ['Completada', 'pill-accent'], no_asistio: ['No vino', 'pill-danger'] };
  const PAGO = { sin_pago: ['Sin seña', 'pill-muted'], por_verificar: ['Pago por verificar', 'pill-warn'], verificado: ['Pago verificado', 'pill-ok'], rechazado: ['Pago rechazado', 'pill-danger'] };
  // Números al estilo cubano: 1000 · 12.500 · 4,10 (igual en todos los navegadores)
  const fmtNum = (n, dec = 0) => { const [e, d] = Math.abs(Number(n) || 0).toFixed(dec).split('.'); const ent = e.length > 4 ? e.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : e; return (Number(n) < 0 ? '−' : '') + ent + (d ? ',' + d : ''); };
  const camIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  const fileHtml = (attrs, texto = 'Elegir foto') => `<div class="file"><input type="file" accept="image/*" ${attrs}><span class="file-ui" aria-hidden="true">${camIcon}<span class="file-name">${texto}</span><span class="file-cta">Buscar</span></span></div>`;
  // Muestra el nombre de la foto elegida en cualquier selector de foto
  document.addEventListener('change', e => {
    const box = e.target.closest?.('.file'); if (!box) return;
    const nombre = e.target.files?.[0]?.name; box.classList.toggle('ok', !!nombre);
    box.querySelector('.file-name').textContent = nombre ? '✓ ' + nombre : 'Elegir foto';
  });
  const montoPago = r => r.moneda_pago && r.moneda_pago !== 'CUP' ? `${fmtNum(r.monto_pago, 2)} ${r.moneda_pago} (${precio(r.sena)})` : precio(r.sena);
  const fmtTarjeta = n => String(n).replace(/\D/g, '').replace(/(\d{4})(?=\d)/g, '$1 ');
  const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const fecha = iso => new Date(iso + 'T12:00:00');
  const sumarDias = (iso, n) => { const d = fecha(iso); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const fmtDia = (iso, o = { weekday: 'long', day: 'numeric', month: 'short' }) => fecha(iso).toLocaleDateString('es', o);
  const hora12 = h => { const [H, M] = h.split(':').map(Number); return `${((H + 11) % 12) + 1}:${String(M).padStart(2, '0')} ${H < 12 ? 'a. m.' : 'p. m.'}`; };
  const precio = n => fmtNum(n) + ' ' + (S.data?.ajustes.moneda || 'CUP');
  const live = t => { $('#live').textContent = ''; setTimeout(() => { $('#live').textContent = t; }, 50); };
  function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = true; void el.offsetWidth; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2800); live(t); }
  const telWA = t => { const d = String(t).replace(/\D/g, ''); return d.length === 8 ? '53' + d : d; };
  const sitio = () => location.origin;
  // Soporte técnico de la app
  const DEV = { estudio: '爪丨匚卄乇.studios', whatsapp: '5355633280' };
  const creditoHtml = () => `<div class="credito"><span>App creada por <strong>${DEV.estudio}</strong></span>
    <a href="https://wa.me/${DEV.whatsapp}" rel="noopener">WhatsApp +53 5563 3280</a></div>`;

  async function api(metodo, url, body) {
    const r = await fetch(url, { method: metodo, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && url !== '/api/admin/login') { S.token = null; try { localStorage.removeItem('estudio_token'); } catch {} renderLogin(j.error); throw new Error(j.error); }
    if (!r.ok) throw new Error(j.error || 'Algo falló. Intenta de nuevo.');
    return j;
  }

  // ---------- Login ----------
  function renderLogin(msg) {
    $('#app').innerHTML = `<main class="wrap" id="contenido"><form class="card login stagger-in" id="loginForm" novalidate>
      <span class="eyebrow" style="--i:0">Panel de la manicurista</span>
      <h1 style="--i:1">Bienvenida</h1>
      <div class="field" style="--i:2"><label for="clave">Contraseña</label><input class="input" type="password" id="clave" autocomplete="current-password" aria-describedby="e-clave"></div>
      <p class="error-text" id="e-clave" role="alert">${esc(msg || '')}</p>
      <button class="btn btn-primary btn-block" type="submit" style="--i:3">Entrar</button></form>${creditoHtml()}</main>`;
    $('#clave').focus();
  }

  async function load() {
    if (!S.token) return renderLogin();
    if (!S.data) {
      $('#app').innerHTML = `<main class="wrap" aria-busy="true"><div class="top"><div class="skel skel-line w40" style="height:1.6em"></div></div>
        <div class="kpis">${Array.from({ length: 4 }, () => `<div class="kpi" aria-hidden="true"><div class="skel skel-line w40"></div><div class="skel" style="height:2rem;width:60%"></div></div>`).join('')}</div>
        ${Array.from({ length: 2 }, () => `<div class="card" aria-hidden="true"><div class="skel skel-line w60"></div><div class="skel skel-line w80"></div><div class="skel skel-line w40"></div></div>`).join('')}</main>`;
    }
    try { S.data = await api('GET', '/api/admin/datos'); renderApp(); } catch {}
  }

  function renderApp() {
    const pend = S.data.reservas.filter(r => r.estado === 'pendiente').length;
    const resPend = S.data.resenas.filter(r => r.estado === 'pendiente').length;
    const tabs = [['agenda', 'Agenda', pend], ['turnos', 'Turnos'], ['catalogo', 'Precios y fotos'], ['resenas', 'Reseñas', resPend], ['estudio', 'Mi estudio']];
    $('#app').innerHTML = `<header class="wrap top"><h1>${esc(S.data.ajustes.nombre)}</h1>
        <div class="row"><a class="btn btn-ghost btn-sm" href="/" target="_blank" rel="noopener">Ver mi web</a><button class="btn btn-ghost btn-sm" type="button" id="logout">Salir</button></div></header>
      <nav class="wrap" aria-label="Secciones del panel"><div class="tabs" role="tablist" aria-label="Secciones del panel">${tabs.map(([k, l, n]) =>
        `<button role="tab" id="tab-${k}" aria-controls="contenido" aria-selected="${S.tab === k}" tabindex="${S.tab === k ? 0 : -1}" data-tab="${k}">${l}${n ? `<span class="badge" aria-label="${n} pendientes">${n}</span>` : ''}</button>`).join('')}<span class="ind" id="ind" aria-hidden="true"></span></div></nav>
      <main class="wrap"><div class="panel-in" id="contenido" role="tabpanel" aria-labelledby="tab-${S.tab}" tabindex="-1"></div></main><footer class="wrap">${creditoHtml()}</footer>`;
    ({ agenda, turnos, catalogo, resenas, estudio })[S.tab]();
    $('#contenido').classList.add('stagger-in'); $$('#contenido > *').forEach((el, i) => el.style.setProperty('--i', i));
    moveInd();
  }
  function moveInd() { const b = $(`[role="tab"][aria-selected="true"]`); const ind = $('#ind'); if (b && ind) { ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft}px)`; const t = b.parentElement; t.scrollLeft = Math.max(0, b.offsetLeft - (t.clientWidth - b.offsetWidth) / 2); } }
  addEventListener('resize', moveInd);

  function contar(el) {
    const hasta = Number(el.dataset.n); const fmt = el.dataset.fmt;
    const pinta = v => { el.textContent = fmt === 'precio' ? precio(v) : fmt === 'pct' ? v + ' %' : v; };
    if (reduced) return pinta(hasta);
    const t0 = performance.now(); const tick = t => { const k = Math.min(1, (t - t0) / 900); pinta(Math.round(hasta * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }

  // ---------- Agenda: resumen + reservas ----------
  function agenda() {
    const { hoy, reservas: todas, turnos: ts } = S.data; const fin = sumarDias(hoy, 6);
    const semana = todas.filter(r => r.fecha >= hoy && r.fecha <= fin && ['confirmada', 'pendiente'].includes(r.estado));
    const ingresos = semana.filter(r => r.estado === 'confirmada').reduce((s, r) => s + r.precio, 0);
    const tsSemana = ts.filter(t => t.fecha >= hoy && t.fecha <= fin && t.estado !== 'bloqueado');
    const ocup = tsSemana.length ? Math.round(tsSemana.filter(t => t.estado === 'reservado').length / tsSemana.length * 100) : 0;
    const cerradas = todas.filter(r => ['completada', 'no_asistio'].includes(r.estado));
    const ausencias = cerradas.length ? Math.round(cerradas.filter(r => r.estado === 'no_asistio').length / cerradas.length * 100) : 0;
    const deHoy = todas.filter(r => r.fecha === hoy && ['confirmada', 'pendiente', 'completada'].includes(r.estado));
    const grupos = {
      pendiente: todas.filter(r => r.estado === 'pendiente'),
      proximas: todas.filter(r => r.estado === 'confirmada' && r.fecha >= hoy),
      historial: todas.filter(r => r.estado !== 'pendiente' && !(r.estado === 'confirmada' && r.fecha >= hoy)).reverse(),
    };
    const lista = grupos[S.filtroRes];
    const wa = (r, tipo) => {
      const a = S.data.ajustes; const cuando = `${fmtDia(r.fecha)} a las ${hora12(r.hora)}`;
      const t = {
        confirmar: `Hola ${r.nombre}, tu turno de ${r.servicio} para el ${cuando} está confirmado.${r.sena ? ` Recibí tu seña de ${precio(r.sena)}; el resto se paga el día del turno.` : ''} ${a.direccion}.`,
        rechazo: `Hola ${r.nombre}, no pude verificar tu transferencia de ${montoPago(r)} para el turno del ${cuando}${r.nota_admin ? ` (${r.nota_admin})` : ''}. Tu turno sigue apartado: entra en "Mis reservas" en ${sitio()}/#espera con tu código ${r.codigo} y envía otro comprobante.`,
        recordar: `Hola ${r.nombre}, te recuerdo tu turno de ${r.servicio} el ${cuando}. ¡Te espero! ${a.direccion}.`,
        volver: `Hola ${r.nombre}, ya van casi 3 semanas desde tu ${r.servicio}. ¿Te reservo para el relleno? Mira los turnos libres: ${sitio()}/#turnos`,
        opinion: `Hola ${r.nombre}, gracias por venir. Si te gustó, me ayudarías mucho dejando tu opinión aquí: ${sitio()}/#estudio`,
      }[tipo];
      return `https://wa.me/${telWA(r.telefono)}?text=${encodeURIComponent(t)}`;
    };
    $('#contenido').innerHTML = `
      <div class="kpis">
        <div class="kpi hl"><span class="muted">Por confirmar</span><strong class="num" data-n="${grupos.pendiente.length}">0</strong></div>
        <div class="kpi"><span class="muted">Pagos por verificar</span><strong class="num" data-n="${todas.filter(r => r.pago === 'por_verificar' && r.estado === 'pendiente').length}">0</strong></div>
        <div class="kpi"><span class="muted">Ingresos confirmados (7 días)</span><strong class="num" data-n="${ingresos}" data-fmt="precio">0</strong></div>
        <div class="kpi"><span class="muted">Ocupación de la semana</span><strong class="num" data-n="${ocup}" data-fmt="pct">0</strong><div class="meter"><i style="--v:${ocup}%"></i></div></div>
        <div class="kpi"><span class="muted">Ausencias (60 días)</span><strong class="num" data-n="${ausencias}" data-fmt="pct">0</strong><div class="meter"><i style="--v:${ausencias}%;background:var(--c-danger)"></i></div></div>
      </div>
      <section class="card" aria-labelledby="hoyT"><h2 class="h" id="hoyT">Hoy, ${fmtDia(hoy, { weekday: 'long', day: 'numeric', month: 'long' })}</h2>
        ${deHoy.length ? `<div class="timeline">${deHoy.map(r => `<div class="t"><strong class="num">${hora12(r.hora)}</strong><span>${esc(r.nombre)} · <span class="muted">${esc(r.servicio)}</span></span><span class="pill ${ESTADO[r.estado][1]}">${ESTADO[r.estado][0]}</span></div>`).join('')}</div>`
          : '<p class="muted">No hay clientas hoy.</p>'}</section>

  function comprimir(file) {
    return new Promise((resolve, reject) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 1200 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        let out = c.toDataURL('image/webp', .8);
        if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', .82);
        resolve(out);
      };
      img.onerror = () => reject(new Error('No se pudo leer la foto.')); img.src = url;
    });
  }

  // ---------- Mapa para marcar la ubicación (Leaflet local) ----------
  function cargarLeaflet() {
    if (window.L) return Promise.resolve(window.L);
    if (cargarLeaflet.p) return cargarLeaflet.p;
    cargarLeaflet.p = new Promise((resolve, reject) => {
      const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = '/vendor/leaflet/leaflet.css'; document.head.appendChild(css);
      const js = document.createElement('script'); js.src = '/vendor/leaflet/leaflet.js';
      js.onload = () => resolve(window.L); js.onerror = () => { cargarLeaflet.p = null; reject(new Error('No se pudo cargar el mapa. Revisa tu conexión.')); };
      document.head.appendChild(js);
    });
    return cargarLeaflet.p;
  }
  const leerCoord = id => parseFloat(String($('#' + id)?.value || '').replace(',', '.'));
  function ponerCoords(la, lo) { $('#a-lat').value = la.toFixed(6); $('#a-lng').value = lo.toFixed(6); }
  async function pintarMapa(zoom) {
    const box = $('#mapPrev'); if (!box) return;
    let L; try { L = await cargarLeaflet(); } catch (e) { box.innerHTML = `<p class="error-text" style="padding:var(--sp-4)">${esc(e.message)}</p>`; return; }
    const la = leerCoord('a-lat'), lo = leerCoord('a-lng'); const hay = Number.isFinite(la) && Number.isFinite(lo);
    const centro = hay ? [la, lo] : [22.1456, -80.4436];            // sin datos: centro de Cienfuegos
    if (!S.mapa || S.mapa.box !== box || !box.isConnected) {
      S.mapa?.m.remove();
      box.innerHTML = '';
      const m = L.map(box, { scrollWheelZoom: false }).setView(centro, hay ? 17 : 14);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
      const icono = L.divIcon({ className: '', iconSize: [34, 44], iconAnchor: [17, 44], html: '<div class="pin-l"><svg viewBox="0 0 34 44" aria-hidden="true"><path d="M17 43S3 27 3 16a14 14 0 0 1 28 0c0 11-14 27-14 27Z" fill="#A3123F"/><circle cx="17" cy="16" r="5.5" fill="#fff"/></svg></div>' });
      const pin = L.marker(centro, { icon: icono, draggable: true, title: 'Ubicación del estudio', alt: 'Pin del estudio' }).addTo(m);
      if (!hay) pin.setOpacity(.45);
      pin.on('dragend', () => { const p = pin.getLatLng(); pin.setOpacity(1); ponerCoords(p.lat, p.lng); $('#geo-msg').textContent = 'Pin movido. Toca "Guardar ubicación".'; });
      m.on('click', ev => { pin.setLatLng(ev.latlng).setOpacity(1); ponerCoords(ev.latlng.lat, ev.latlng.lng); $('#geo-msg').textContent = 'Pin colocado. Toca "Guardar ubicación".'; });
      S.mapa = { m, pin, box, L };
      setTimeout(() => m.invalidateSize(), 250);
    } else if (hay) {
      S.mapa.pin.setLatLng(centro).setOpacity(1);
      S.mapa.m.setView(centro, zoom || Math.max(S.mapa.m.getZoom(), 16));
    }
  }
  function coordsDeEnlace(url) {
    const pats = [/@(-?\d+\.\d+),(-?\d+\.\d+)/, /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/, /(-?\d{1,2}\.\d{3,}),\s*(-?\d{1,3}\.\d{3,})/];
    for (const p of pats) { const m = p.exec(decodeURIComponent(url)); if (m) return [m[1], m[2]]; }
    return null;
  }

      ['banco', 'numero', 'confirmar', 'general'].forEach(k => { $('#ce-' + k).textContent = ''; });
      const dig = body.numero.replace(/\D/g, '').length;
      if (tipo === 'tarjeta' && dig !== 16) { $('#ce-numero').textContent = 'El número de tarjeta debe tener 16 dígitos.'; return $('#c-numero').focus(); }
      if (tipo === 'saldo' && (dig < 8 || dig > 11)) { $('#ce-numero').textContent = 'Escribe el móvil con 8 dígitos.'; return $('#c-numero').focus(); }
      try { S.editCard ? await api('PUT', '/api/admin/tarjetas/' + S.editCard.id, body) : await api('POST', '/api/admin/tarjetas', body); $('#cardDialog').close(); toast('Método de pago guardado'); load(); }
      catch (err) { $('#ce-general').textContent = err.message; }
      return;
    }
    if (id === 'svcForm') {
      const lineas = $('#s-vars').value.split('\n').map(l => l.trim()).filter(Boolean);
      const malas = lineas.filter(l => !/^.+?[=:]\s*[\d\s.,]+$/.test(l));
      if (malas.length) { $('#s-error').textContent = `Revisa esta línea de opciones: "${malas[0]}". Usa el formato nombre = precio.`; return $('#s-vars').focus(); }
      const variantes = lineas.map(l => { const m = /^(.+?)\s*[=:]\s*([\d\s.,]+)$/.exec(l); return { nombre: m[1].trim(), precio: Number(m[2].replace(/[\s.,]/g, '')) }; });
      if (!variantes.length && $('#s-precio').value === '') { $('#s-error').textContent = 'Pon un precio o al menos una opción de precio.'; return $('#s-precio').focus(); }
      const body = { nombre: $('#s-nombre').value, categoria: $('#s-categoria').value, precio: $('#s-precio').value || 0, duracion: $('#s-duracion').value,
        orden: $('#s-orden').value, descripcion: $('#s-desc').value, popular: $('#s-popular').checked, extra: $('#s-extra').checked, activo: $('#s-activo').checked, variantes };
      try { S.editSvc ? await api('PUT', '/api/admin/servicios/' + S.editSvc.id, body) : await api('POST', '/api/admin/servicios', body); $('#svcDialog').close(); toast('Servicio guardado'); load(); }
      catch (err) { $('#s-error').textContent = err.message; }
      return;
    }
    if (id === 'workForm') {
      const titulo = $('#w-titulo').value.trim();
      if (!titulo) { $('#w-error').textContent = 'Ponle un título al trabajo.'; return $('#w-titulo').focus(); }
      const btn = $('#w-btn'); btn.disabled = true; btn.textContent = 'Subiendo…';
      try { await api('POST', '/api/admin/trabajos', { titulo, categoria: $('#w-cat').value, forma: $('#w-forma').value, color: $('#w-color').value, imagen: S.foto || null }); S.foto = null; toast('Publicado en la galería'); load(); }
      catch (err) { $('#w-error').textContent = err.message; btn.disabled = false; btn.textContent = 'Publicar en la galería'; }
    }
  });

  $('#compDialog').addEventListener('close', () => { if (S.compURL) { URL.revokeObjectURL(S.compURL); S.compURL = null; } });
  document.addEventListener('input', e => { if (e.target.id === 'c-numero' && $('#c-tipo')?.value !== 'saldo') { const p = e.target.selectionStart === e.target.value.length; e.target.value = fmtTarjeta(e.target.value).slice(0, 19); if (!p) return; } });
  document.addEventListener('keydown', e => {
    if (!e.target.matches('[role="tab"]')) return;
    const tabs = $$('[role="tab"]'); const i = tabs.indexOf(e.target);
    const n = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i - 1 + tabs.length) % tabs.length }[e.key];
    if (n !== undefined) { e.preventDefault(); tabs[n].click(); }
  });

  // Datos al día sin recargar: al cambiar de sección, al volver a la app y cada 45 s.
  // No repinta si está escribiendo o con una ventana abierta, para no perder nada.
  async function refrescar(forzar) {
    if (!S.token || !S.data) return;
    const ocupada = document.querySelector('dialog[open]') || document.activeElement?.matches('input, textarea, select') || S.tab === 'estudio' || S.tab === 'catalogo';
    try {
      const nuevo = await api('GET', '/api/admin/datos');
      const antes = S.data.reservas.filter(r => r.estado === 'pendiente').length; const ahora = nuevo.reservas.filter(r => r.estado === 'pendiente').length;
      const cambio = JSON.stringify(nuevo.reservas) + JSON.stringify(nuevo.resenas) + JSON.stringify(nuevo.turnos) !== JSON.stringify(S.data.reservas) + JSON.stringify(S.data.resenas) + JSON.stringify(S.data.turnos);
      if (!cambio) return;
      if (ahora > antes) toast(ahora - antes === 1 ? 'Llegó un pedido nuevo' : `Llegaron ${ahora - antes} pedidos nuevos`);
      if (ocupada && !forzar) return;
      const y = scrollY; S.data = nuevo; renderApp(); scrollTo(0, y);
    } catch {}
  }
  setInterval(() => { if (document.visibilityState === 'visible') refrescar(); }, 45000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refrescar(); });
  document.addEventListener('click', e => { const t = e.target.closest('[role="tab"]'); if (t && !['estudio', 'catalogo'].includes(t.dataset.tab)) refrescar(true); });
  // Título de la pestaña con los pendientes, para verlos desde otra pestaña del navegador
  setInterval(() => { const n = S.data ? S.data.reservas.filter(r => r.estado === 'pendiente').length : 0; document.title = (n ? `(${n}) ` : '') + 'Panel del Estudio'; }, 2000);

  load();
})();
</script>
