<title>Panel del Estudio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Unbounded:wght@500;600&display=swap">
<link rel="stylesheet" href="design.css">
<style>
  .wrap { max-width: 760px; margin: 0 auto; padding-inline: var(--sp-4); }
  main.wrap { padding-block: var(--sp-4) var(--sp-7); display: grid; gap: var(--sp-4); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding-block: var(--sp-4); flex-wrap: wrap; }
  .top h1 { font-size: var(--fs-lg); }
  .tabs { display: flex; gap: var(--sp-1); overflow-x: auto; border-bottom: 1px solid var(--c-line); scrollbar-width: none; }
  .tabs button { min-height: var(--tap); padding: 0 var(--sp-4); border: 0; background: none; color: var(--c-muted); font: 600 var(--fs-sm) var(--f-body); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--c-ink); border-bottom-color: var(--c-accent); }
  .badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--c-accent); color: var(--c-accent-ink); font-size: 11px; }
  .card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-md); padding: var(--sp-4); display: grid; gap: var(--sp-3); }
  .row { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
  .row.between { justify-content: space-between; }
  .grid2 { display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .list { display: grid; gap: var(--sp-3); }
  .seg { display: inline-flex; border: 1.5px solid var(--c-line); border-radius: var(--r-pill); padding: 3px; gap: 2px; }
  .seg button { min-height: 36px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-pill); background: none; color: var(--c-ink); font: 600 var(--fs-xs) var(--f-body); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--c-ink); color: var(--c-bg); }
  .booking-when { font-family: var(--f-display); font-size: var(--fs-md); font-weight: 600; }
  .note { font-size: var(--fs-sm); background: var(--c-bg); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); }
  .day-block h3 { font-family: var(--f-body); font-size: var(--fs-md); font-weight: 700; text-transform: capitalize; }
  .slot-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: var(--sp-2); align-items: center; padding-block: var(--sp-2); border-top: 1px solid var(--c-line); }
  .slot-row .btn { min-height: 36px; padding: 0 var(--sp-3); }
  .weekdays { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .weekdays label { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0 var(--sp-3); border: 1.5px solid var(--c-line); border-radius: var(--r-pill); cursor: pointer; font-size: var(--fs-sm); }
  .weekdays input { width: 18px; height: 18px; accent-color: var(--c-accent); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--sp-3); }
  .thumb { display: grid; gap: var(--sp-1); font-size: var(--fs-sm); }
  .thumb .ph { aspect-ratio: 1; max-width: 100%; border-radius: var(--r-sm); overflow: hidden; background: var(--c-skel); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .login { max-width: 380px; margin: 12vh auto 0; }
  .preview { width: 120px; aspect-ratio: 1; border-radius: var(--r-sm); object-fit: cover; }
  .check { display: flex; gap: var(--sp-2); align-items: center; min-height: var(--tap); }
  .check input { width: 20px; height: 20px; accent-color: var(--c-accent); }
</style>

<a class="skip-link" href="#contenido">Saltar al contenido</a>
<div id="app"></div>
<div class="sr-only" aria-live="polite" id="live"></div>
<div class="toast" id="toast" role="status" hidden></div>

<dialog class="sheet" id="svcDialog" aria-labelledby="svcTitle">
  <div class="sheet-head"><h2 id="svcTitle" style="font-size:var(--fs-lg)">Servicio</h2><button class="icon-btn" type="button" data-close aria-label="Cerrar">×</button></div>
  <form class="sheet-body" id="svcForm" novalidate></form>
</dialog>

<script>
(() => {
  'use strict';
  document.documentElement.lang = 'es';
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const S = { token: null, data: null, tab: 'reservas', filtroRes: 'pendiente', editSvc: null };
  try { S.token = localStorage.getItem('estudio_token'); } catch {}

  const ESTADO = { pendiente: ['Pendiente', 'pill-warn'], confirmada: ['Confirmada', 'pill-ok'], cancelada: ['Cancelada', 'pill-muted'], completada: ['Completada', 'pill-accent'], no_asistio: ['No vino', 'pill-danger'] };
  const fecha = iso => new Date(iso + 'T12:00:00');
  const fmtDia = (iso, o = { weekday: 'long', day: 'numeric', month: 'short' }) => fecha(iso).toLocaleDateString('es', o);
  const hora12 = h => { const [H, M] = h.split(':').map(Number); return `${((H + 11) % 12) + 1}:${String(M).padStart(2, '0')} ${H < 12 ? 'a. m.' : 'p. m.'}`; };
  const precio = n => new Intl.NumberFormat('es-CU').format(n) + ' ' + (S.data?.ajustes.moneda || 'CUP');
  const live = t => { $('#live').textContent = ''; setTimeout(() => { $('#live').textContent = t; }, 50); };
  function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2600); live(t); }

  async function api(metodo, url, body) {
    const r = await fetch(url, { method: metodo, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && url !== '/api/admin/login') { S.token = null; try { localStorage.removeItem('estudio_token'); } catch {} renderLogin(j.error); throw new Error(j.error); }
    if (!r.ok) throw new Error(j.error || 'Algo falló. Intenta de nuevo.');
    return j;
  }

  // ---------- Login ----------
  function renderLogin(msg) {
    $('#app').innerHTML = `<main class="wrap" id="contenido"><form class="card login" id="loginForm" novalidate>
      <h1 style="font-size:var(--fs-xl)">Panel del estudio</h1>
      <div class="field"><label for="clave">Contraseña</label><input class="input" type="password" id="clave" autocomplete="current-password" aria-describedby="e-clave"></div>
      <p class="error-text" id="e-clave" role="alert">${esc(msg || '')}</p>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button></form></main>`;
    $('#clave').focus();
  }

  // ---------- Carga con skeleton ----------
  async function load() {
    if (!S.token) return renderLogin();
    if (!S.data) {
      $('#app').innerHTML = `<main class="wrap" aria-busy="true"><div class="top"><div class="skel skel-line w40" style="height:1.4em"></div></div>
        ${Array.from({ length: 3 }, () => `<div class="card" aria-hidden="true"><div class="skel skel-line w60"></div><div class="skel skel-line w80"></div><div class="skel skel-line w40"></div></div>`).join('')}</main>`;
    }
    try { S.data = await api('GET', '/api/admin/datos'); renderApp(); } catch {}
  }

  function renderApp() {
    const pend = S.data.reservas.filter(r => r.estado === 'pendiente').length;
    const tabs = [['reservas', 'Reservas', pend], ['turnos', 'Turnos'], ['precios', 'Precios'], ['galeria', 'Galería'], ['ajustes', 'Ajustes']];
    $('#app').innerHTML = `<header class="wrap top"><h1>${esc(S.data.ajustes.nombre)}</h1>
        <div class="row"><a class="btn btn-ghost" href="/" target="_blank" rel="noopener">Ver web</a><button class="btn btn-ghost" type="button" id="logout">Salir</button></div></header>
      <div class="wrap"><div class="tabs" role="tablist" aria-label="Secciones del panel">${tabs.map(([k, l, n]) =>
        `<button role="tab" id="tab-${k}" aria-controls="contenido" aria-selected="${S.tab === k}" tabindex="${S.tab === k ? 0 : -1}" data-tab="${k}">${l}${n ? `<span class="badge" aria-label="${n} pendientes">${n}</span>` : ''}</button>`).join('')}</div></div>
      <main class="wrap" id="contenido" role="tabpanel" aria-labelledby="tab-${S.tab}" tabindex="-1"></main>`;
    ({ reservas, turnos, precios, galeria, ajustes })[S.tab]();
  }

  // ---------- Reservas ----------
  function reservas() {
    const hoy = S.data.hoy; const todas = S.data.reservas;
    const grupos = {
      pendiente: todas.filter(r => r.estado === 'pendiente'),
      proximas: todas.filter(r => r.estado === 'confirmada' && r.fecha >= hoy),
      historial: todas.filter(r => !['pendiente'].includes(r.estado) && !(r.estado === 'confirmada' && r.fecha >= hoy)).reverse(),
    };
    const lista = grupos[S.filtroRes];
    const wa = (r, tipo) => {
      const cuando = `${fmtDia(r.fecha)} a las ${hora12(r.hora)}`;
      const t = tipo === 'confirmar'
        ? `Hola ${r.nombre}, tu turno de ${r.servicio} para el ${cuando} está confirmado. ${S.data.ajustes.sena}`
        : `Hola ${r.nombre}, te recuerdo tu turno de ${r.servicio} el ${cuando}. ¡Te espero!`;
      return `https://wa.me/${r.telefono.replace(/\D/g, '').replace(/^(\d{8})$/, '53$1')}?text=${encodeURIComponent(t)}`;
    };
    $('#contenido').innerHTML = `
      <div class="row between"><div class="seg" role="group" aria-label="Filtrar reservas">
        ${[['pendiente', 'Por confirmar'], ['proximas', 'Próximas'], ['historial', 'Historial']].map(([k, l]) =>
          `<button type="button" aria-pressed="${S.filtroRes === k}" data-fres="${k}">${l} (${grupos[k].length})</button>`).join('')}</div></div>
      <div class="list">${lista.length ? lista.map(r => `<article class="card" aria-labelledby="res-${r.id}">
        <div class="row between"><span class="booking-when" id="res-${r.id}">${fmtDia(r.fecha)} · ${hora12(r.hora)}</span><span class="pill ${ESTADO[r.estado][1]}">${ESTADO[r.estado][0]}</span></div>
        <div><strong>${esc(r.nombre)}</strong> · <span class="num">${esc(r.telefono)}</span></div>
        <div class="muted">${esc(r.servicio)} · <span class="num">${precio(r.precio)}</span></div>
        ${r.notas ? `<p class="note">${esc(r.notas)}</p>` : ''}
        <div class="row">
          ${r.estado === 'pendiente' ? `<button class="btn btn-primary" data-res="${r.id}" data-estado="confirmada">Confirmar</button><a class="btn btn-soft" href="${wa(r, 'confirmar')}" target="_blank" rel="noopener">Escribir por WhatsApp</a>` : ''}
          ${r.estado === 'confirmada' ? `<a class="btn btn-soft" href="${wa(r, 'recordar')}" target="_blank" rel="noopener">Enviar recordatorio</a><button class="btn btn-ghost" data-res="${r.id}" data-estado="completada">Completada</button><button class="btn btn-ghost" data-res="${r.id}" data-estado="no_asistio">No vino</button>` : ''}
          ${['pendiente', 'confirmada'].includes(r.estado) ? `<button class="btn btn-danger" data-res="${r.id}" data-estado="cancelada">Cancelar</button>` : ''}
          ${r.estado === 'cancelada' && r.fecha >= hoy ? `<button class="btn btn-ghost" data-res="${r.id}" data-estado="pendiente">Reactivar</button>` : ''}
        </div></article>`).join('')
        : `<div class="card muted">${S.filtroRes === 'pendiente' ? 'No hay reservas por confirmar.' : 'Nada por aquí todavía.'}</div>`}</div>`;
  }

  // ---------- Turnos ----------
  function turnos() {
    const hoy = S.data.hoy;
    const porDia = {};
    for (const t of S.data.turnos) (porDia[t.fecha] ||= []).push(t);
    const reservaDe = id => S.data.reservas.find(r => r.turno_id === id && r.estado !== 'cancelada');
    const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    $('#contenido').innerHTML = `
      <form class="card" id="genForm" novalidate>
        <h2 style="font-size:var(--fs-lg)">Abrir turnos</h2>
        <div class="grid2">
          <div class="field"><label for="g-desde">Desde</label><input class="input" type="date" id="g-desde" value="${hoy}"></div>
          <div class="field"><label for="g-dias">Durante</label><select class="input" id="g-dias"><option value="7">1 semana</option><option value="14">2 semanas</option><option value="28">4 semanas</option></select></div>
        </div>
        <fieldset><legend class="label" style="font-size:var(--fs-sm)">Días que trabajas</legend>
          <div class="weekdays">${dias.map((d, i) => `<label><input type="checkbox" name="dow" value="${i}" ${i ? 'checked' : ''}>${d}</label>`).join('')}</div></fieldset>
        <div class="field"><label for="g-horas">Horas de inicio</label>
          <input class="input num" id="g-horas" value="09:00, 10:30, 12:00, 14:00, 15:30, 17:00" aria-describedby="g-hint">
          <span class="hint" id="g-hint">Separadas por coma, formato 24 h. Si un turno ya existe no se duplica.</span></div>
        <button class="btn btn-primary" type="submit">Crear turnos</button>
      </form>
      ${Object.keys(porDia).length ? Object.entries(porDia).filter(([f]) => f >= hoy).map(([f, ts]) => `<section class="card day-block" aria-labelledby="d-${f}">
        <div class="row between"><h3 id="d-${f}">${fmtDia(f)}</h3><span class="muted num">${ts.filter(t => t.estado === 'libre').length} libres de ${ts.length}</span></div>
        <div>${ts.map(t => { const r = reservaDe(t.id); return `<div class="slot-row">
          <span class="num"><strong>${t.hora}</strong></span>
          <span>${t.estado === 'reservado' ? `<span class="pill pill-accent">Reservado</span> ${esc(r?.nombre || '')}` : t.estado === 'bloqueado' ? '<span class="pill pill-muted">Bloqueado</span>' : '<span class="pill pill-ok">Libre</span>'}</span>
          <span class="row">${t.estado === 'reservado' ? '' : `<button class="btn btn-ghost" data-slot="${t.id}" data-to="${t.estado === 'libre' ? 'bloqueado' : 'libre'}">${t.estado === 'libre' ? 'Bloquear' : 'Liberar'}</button><button class="btn btn-danger" data-delslot="${t.id}" aria-label="Quitar turno de las ${t.hora}">Quitar</button>`}</span>
        </div>`; }).join('')}</div></section>`).join('') : '<div class="card muted">Aún no hay turnos. Crea los de esta semana arriba.</div>'}`;
  }

  // ---------- Precios ----------
  function precios() {
    const { servicios, categorias } = S.data;
    $('#contenido').innerHTML = `<div class="row between"><h2 style="font-size:var(--fs-lg)">Servicios y precios</h2><button class="btn btn-primary" data-newsvc>Agregar servicio</button></div>
      ${categorias.map(c => { const it = servicios.filter(s => s.categoria === c); return it.length ? `<section class="card" aria-labelledby="c-${c}"><h3 id="c-${c}" style="font-family:var(--f-body);font-size:var(--fs-md)">${c}</h3>
        ${it.map(s => `<div class="row between" style="border-top:1px solid var(--c-line);padding-top:var(--sp-3)">
          <div><strong>${esc(s.nombre)}</strong> ${s.popular ? '<span class="pill pill-accent">Más pedido</span>' : ''} ${s.activo ? '' : '<span class="pill pill-muted">Oculto</span>'}
            <div class="muted num" style="font-size:var(--fs-sm)">${precio(s.precio)} · ${s.duracion} min</div></div>
          <div class="row"><button class="btn btn-ghost" data-editsvc="${s.id}">Editar</button><button class="btn btn-danger" data-delsvc="${s.id}" aria-label="Borrar ${esc(s.nombre)}">Borrar</button></div></div>`).join('')}</section>` : ''; }).join('')
      || '<div class="card muted">Agrega tu primer servicio para que aparezca la lista de precios.</div>'}`;
  }
  function openSvc(s) {
    S.editSvc = s || null;
    $('#svcTitle').textContent = s ? 'Editar servicio' : 'Nuevo servicio';
    $('#svcForm').innerHTML = `
      <div class="field"><label for="s-nombre">Nombre</label><input class="input" id="s-nombre" value="${esc(s?.nombre || '')}" required></div>
      <div class="grid2">
        <div class="field"><label for="s-categoria">Categoría</label><select class="input" id="s-categoria">${S.data.categorias.map(c => `<option ${s?.categoria === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label for="s-precio">Precio (${esc(S.data.ajustes.moneda)})</label><input class="input num" id="s-precio" type="number" min="0" inputmode="numeric" value="${s?.precio ?? ''}" required></div>
        <div class="field"><label for="s-duracion">Duración (min)</label><input class="input num" id="s-duracion" type="number" min="5" step="5" value="${s?.duracion ?? 60}"></div>
        <div class="field"><label for="s-orden">Orden</label><input class="input num" id="s-orden" type="number" value="${s?.orden ?? 0}"></div>
      </div>
      <div class="field"><label for="s-desc">Descripción corta</label><textarea class="input" id="s-desc" maxlength="240">${esc(s?.descripcion || '')}</textarea></div>
      <label class="check"><input type="checkbox" id="s-popular" ${s?.popular ? 'checked' : ''}> Marcar como "Más pedido"</label>
      <label class="check"><input type="checkbox" id="s-activo" ${s?.activo === 0 ? '' : 'checked'}> Visible en la web</label>
      <p class="error-text" id="s-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Guardar</button>`;
    $('#svcDialog').showModal(); $('#s-nombre').focus();
  }

  // ---------- Galería ----------
  function galeria() {
    const { trabajos, categorias } = S.data;
    $('#contenido').innerHTML = `
      <form class="card" id="workForm" novalidate>
        <h2 style="font-size:var(--fs-lg)">Subir trabajo</h2>
        <div class="field"><label for="w-foto">Foto</label><input class="input" type="file" id="w-foto" accept="image/*" aria-describedby="w-hint">
          <span class="hint" id="w-hint">Se reduce a 1200 px en WEBP antes de subir para gastar menos datos.</span></div>
        <img id="w-prev" class="preview" alt="Vista previa" hidden>
        <div class="grid2">
          <div class="field"><label for="w-titulo">Título</label><input class="input" id="w-titulo" placeholder="Ej. French rosado"></div>
          <div class="field"><label for="w-cat">Categoría</label><select class="input" id="w-cat">${categorias.map(c => `<option>${c}</option>`).join('')}</select></div>
          <div class="field"><label for="w-forma">Forma</label><select class="input" id="w-forma"><option>almendra</option><option>cuadrada</option><option>coffin</option><option>redonda</option></select></div>
          <div class="field"><label for="w-color">Color principal</label><input class="input" type="color" id="w-color" value="#A3123F"></div>
        </div>
        <p class="error-text" id="w-error" role="alert"></p>
        <button class="btn btn-primary" type="submit" id="w-btn">Publicar en la galería</button>
      </form>
      <div class="thumbs">${trabajos.map(t => `<div class="thumb"><div class="ph">${t.imagen ? `<img src="${esc(t.imagen)}" alt="${esc(t.titulo)}" loading="lazy">` : `<div style="width:100%;height:100%;background:${esc(t.color)}" role="img" aria-label="${esc(t.titulo)} (sin foto)"></div>`}</div>
        <strong>${esc(t.titulo)}</strong><span class="muted">${esc(t.categoria)}</span>
        <button class="btn btn-danger" data-delwork="${t.id}" aria-label="Borrar ${esc(t.titulo)}">Borrar</button></div>`).join('')}</div>`;
  }
  function comprimir(file) {
    return new Promise((resolve, reject) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 1200 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        let out = c.toDataURL('image/webp', .8);
        if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', .82);
        resolve(out);
      };
      img.onerror = () => reject(new Error('No se pudo leer la foto.')); img.src = url;
    });
  }

  // ---------- Ajustes ----------
  function ajustes() {
    const a = S.data.ajustes;
    const campos = [['nombre', 'Nombre del estudio'], ['eslogan', 'Frase corta'], ['whatsapp', 'WhatsApp (con 53 delante)'], ['instagram', 'Instagram (sin @)'], ['direccion', 'Dirección'], ['moneda', 'Moneda']];
    $('#contenido').innerHTML = `<form class="card" id="ajForm" novalidate><h2 style="font-size:var(--fs-lg)">Datos del estudio</h2>
      <div class="grid2">${campos.map(([k, l]) => `<div class="field"><label for="a-${k}">${l}</label><input class="input" id="a-${k}" value="${esc(a[k])}" ${k === 'whatsapp' ? 'inputmode="tel"' : ''}></div>`).join('')}</div>
      <div class="field"><label for="a-sena">Seña y forma de pago</label><textarea class="input" id="a-sena">${esc(a.sena)}</textarea></div>
      <div class="field"><label for="a-politica">Política de cancelación</label><textarea class="input" id="a-politica">${esc(a.politica)}</textarea></div>
      <button class="btn btn-primary" type="submit">Guardar cambios</button></form>`;
  }

  // ---------- Eventos ----------
  async function run(fn, ok) { try { await fn(); if (ok) toast(ok); await load(); } catch (e) { toast(e.message); } }

  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.hasAttribute('data-close')) return t.closest('dialog').close();
    if (t.id === 'logout') { S.token = null; S.data = null; try { localStorage.removeItem('estudio_token'); } catch {} return renderLogin(); }
    if (t.dataset.tab) { S.tab = t.dataset.tab; renderApp(); return $('#tab-' + S.tab).focus(); }
    if (t.dataset.fres) { S.filtroRes = t.dataset.fres; return reservas(); }
    if (t.dataset.res) return run(() => api('PUT', '/api/admin/reservas/' + t.dataset.res, { estado: t.dataset.estado }), 'Reserva actualizada');
    if (t.dataset.slot) return run(() => api('PUT', '/api/admin/turnos/' + t.dataset.slot, { estado: t.dataset.to }), t.dataset.to === 'libre' ? 'Turno liberado' : 'Turno bloqueado');
    if (t.dataset.delslot) return run(() => api('DELETE', '/api/admin/turnos/' + t.dataset.delslot), 'Turno quitado');
    if (t.hasAttribute('data-newsvc')) return openSvc();
    if (t.dataset.editsvc) return openSvc(S.data.servicios.find(s => s.id === Number(t.dataset.editsvc)));
    // Borrados con confirmación en dos toques (sin confirm() nativo)
    if (t.dataset.delsvc || t.dataset.delwork) {
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.dataset.orig = t.textContent; t.textContent = '¿Seguro? Toca otra vez'; setTimeout(() => { if (t.isConnected) { t.dataset.armed = ''; t.textContent = t.dataset.orig; } }, 3000); return; }
      return t.dataset.delsvc
        ? run(() => api('DELETE', '/api/admin/servicios/' + t.dataset.delsvc), 'Servicio borrado')
        : run(() => api('DELETE', '/api/admin/trabajos/' + t.dataset.delwork), 'Trabajo borrado');
    }
  });

  document.addEventListener('change', async e => {
    if (e.target.id === 'w-foto' && e.target.files[0]) {
      try { S.foto = await comprimir(e.target.files[0]); const p = $('#w-prev'); p.src = S.foto; p.hidden = false; }
      catch (err) { $('#w-error').textContent = err.message; }
    }
  });

  document.addEventListener('submit', async e => {
    e.preventDefault(); const id = e.target.id;
    if (id === 'loginForm') {
      try { const { token } = await api('POST', '/api/admin/login', { clave: $('#clave').value }); S.token = token; try { localStorage.setItem('estudio_token', token); } catch {} load(); }
      catch (err) { $('#e-clave').textContent = err.message; $('#clave').setAttribute('aria-invalid', 'true'); $('#clave').focus(); }
    }
    if (id === 'genForm') {
      const horas = $('#g-horas').value.split(/[,\s]+/).filter(Boolean).map(h => h.padStart(5, '0'));
      const diasSemana = [...document.querySelectorAll('input[name="dow"]:checked')].map(i => Number(i.value));
      run(async () => { const r = await api('POST', '/api/admin/turnos/generar', { desde: $('#g-desde').value, dias: Number($('#g-dias').value), diasSemana, horas }); toast(`${r.creados} turnos creados`); });
    }
    if (id === 'svcForm') {
      const body = { nombre: $('#s-nombre').value, categoria: $('#s-categoria').value, precio: $('#s-precio').value, duracion: $('#s-duracion').value,
        orden: $('#s-orden').value, descripcion: $('#s-desc').value, popular: $('#s-popular').checked, activo: $('#s-activo').checked };
      try {
        S.editSvc ? await api('PUT', '/api/admin/servicios/' + S.editSvc.id, body) : await api('POST', '/api/admin/servicios', body);
        $('#svcDialog').close(); toast('Servicio guardado'); load();
      } catch (err) { $('#s-error').textContent = err.message; }
    }
    if (id === 'workForm') {
      const titulo = $('#w-titulo').value.trim();
      if (!titulo) { $('#w-error').textContent = 'Ponle un título al trabajo.'; return $('#w-titulo').focus(); }
      const btn = $('#w-btn'); btn.disabled = true; btn.textContent = 'Subiendo…';
      try { await api('POST', '/api/admin/trabajos', { titulo, categoria: $('#w-cat').value, forma: $('#w-forma').value, color: $('#w-color').value, imagen: S.foto || null }); S.foto = null; toast('Publicado en la galería'); load(); }
      catch (err) { $('#w-error').textContent = err.message; btn.disabled = false; btn.textContent = 'Publicar en la galería'; }
    }
    if (id === 'ajForm') {
      const body = {}; for (const k of ['nombre', 'eslogan', 'whatsapp', 'instagram', 'direccion', 'moneda', 'sena', 'politica']) body[k] = $('#a-' + k).value;
      run(() => api('PUT', '/api/admin/ajustes', body), 'Cambios guardados');
    }
  });

  document.addEventListener('keydown', e => {
    if (!e.target.matches('[role="tab"]')) return;
    const tabs = [...document.querySelectorAll('[role="tab"]')]; const i = tabs.indexOf(e.target);
    const n = e.key === 'ArrowRight' ? (i + 1) % tabs.length : e.key === 'ArrowLeft' ? (i - 1 + tabs.length) % tabs.length : null;
    if (n !== null) { e.preventDefault(); tabs[n].click(); }
  });

  load();
})();
</script>
