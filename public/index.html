<title>Uñas Leyanis</title>
<meta name="description" content="Trabajos, precios, turnos libres de la semana, ubicación y horario. Reserva en un minuto.">
<meta property="og:title" content="Reserva tu turno de uñas">
<meta property="og:description" content="Mira mis trabajos, precios y turnos libres de esta semana.">
<meta name="theme-color" content="#A3123F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Figtree:wght@400;600;700&display=swap">
<link rel="stylesheet" href="design.css">
<style>
  /* Vista pública. Todo color, tipo, medida y curva sale de design.css */
  .wrap { max-width: var(--w-page); margin: 0 auto; padding-inline: var(--sp-4); }
  main.wrap { padding-block: var(--sp-4) calc(104px + env(safe-area-inset-bottom, 0px)); }

  /* ---------- Promo ---------- */
  .promo {
    display: flex; align-items: center; justify-content: center; gap: var(--sp-2); text-align: center;
    padding: var(--sp-2) var(--sp-4); font-size: var(--fs-sm); font-weight: 600; color: var(--c-accent-ink);
    background: linear-gradient(110deg, var(--c-accent) 0%, var(--c-accent) 40%, color-mix(in srgb, var(--c-accent) 70%, var(--c-gloss)) 50%, var(--c-accent) 60%) 0 0 / 250% 100%;
    animation: promo-sheen 6s var(--ease-in-out) infinite;
  }
  @keyframes promo-sheen { 0%, 40% { background-position: 100% 0; } 100% { background-position: -150% 0; } }

  /* ---------- Portada ---------- */
  .hero { position: relative; padding-block: var(--sp-7) var(--sp-5); display: grid; gap: var(--sp-3); }
  .hero-swirl { position: absolute; right: -60px; top: 6px; width: 260px; height: 260px; z-index: -1; opacity: .9; pointer-events: none; animation: swirl 40s linear infinite; }
  @keyframes swirl { to { transform: rotate(360deg); } }
  .brand { font-size: var(--fs-2xl); letter-spacing: -.01em; line-height: 1; }
  .brand em { color: var(--c-accent); font-weight: 500; }
  .brand .l { display: inline-block; animation: letter-in 1s var(--ease-out) backwards; animation-delay: calc(180ms + var(--i) * 45ms); }
  @keyframes letter-in { from { opacity: 0; transform: translateY(.45em) rotate(6deg); filter: blur(8px); } }
  .brush { width: min(100%, 320px); height: 26px; margin-top: calc(-1 * var(--sp-2)); overflow: visible; }
  .brush .paint { stroke-dasharray: 380; stroke-dashoffset: 380; animation: paint 1.1s var(--ease-in-out) 750ms forwards; }
  .brush .shine { stroke-dasharray: 60 400; stroke-dashoffset: 60; opacity: 0; animation: shine 5.5s var(--ease-in-out) 2s infinite; }
  @keyframes paint { to { stroke-dashoffset: 0; } }
  @keyframes shine { 0% { stroke-dashoffset: 60; opacity: 0; } 10% { opacity: .9; } 40%, 100% { stroke-dashoffset: -380; opacity: 0; } }
  .hero-in { animation: fade-up var(--dur-slow) var(--ease-out) backwards; animation-delay: var(--d, 0ms); }
  .tagline { font-size: var(--fs-lg); max-width: 32ch; }
  .status-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
  .status { display: inline-flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) var(--sp-3); border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: 600; background: var(--c-surface); border: 1px solid var(--c-line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c-muted); }
  .dot.on { background: var(--c-ok); color: var(--c-ok); animation: pulse-ring 1.8s var(--ease-out) infinite; }
  .rating-chip { display: inline-flex; gap: var(--sp-1); align-items: center; }
  .rating-chip .star { color: var(--c-gloss); }
  .next-free { font-size: var(--fs-sm); }
  .hero-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding-top: var(--sp-2); }

  .demo-note { background: var(--c-warn-soft); color: var(--c-warn); font-size: var(--fs-xs); font-weight: 600; padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); margin-bottom: var(--sp-4); }

  /* ---------- Paneles ---------- */
  .panel { display: grid; gap: var(--sp-5); }
  .panel.enter-r { animation: panel-r 520ms var(--ease-out); }
  .panel.enter-l { animation: panel-l 520ms var(--ease-out); }
  @keyframes panel-r { from { opacity: 0; transform: translateX(28px); } }
  @keyframes panel-l { from { opacity: 0; transform: translateX(-28px); } }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; }
  .panel-head h2 { font-size: var(--fs-xl); }
  .section { display: grid; gap: var(--sp-3); }
  .section > h3 { font-size: var(--fs-lg); font-style: italic; font-weight: 500; }
  .card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-md); padding: var(--sp-4); display: grid; gap: var(--sp-3); }

  /* ---------- Galería ---------- */
  .chips { display: flex; gap: var(--sp-2); overflow-x: auto; padding: 2px 2px var(--sp-1); scrollbar-width: none; }
  .chip {
    min-height: 38px; padding: 0 var(--sp-4); border-radius: var(--r-pill); border: 1.5px solid var(--c-line);
    background: var(--c-surface); color: var(--c-ink); font: 600 var(--fs-sm) var(--f-body); cursor: pointer; white-space: nowrap;
    transition: background var(--dur) var(--ease-out), color var(--dur) var(--ease-out), border-color var(--dur), transform var(--dur-fast);
  }
  .chip:active { transform: scale(.95); }
  .chip[aria-pressed="true"] { background: var(--c-ink); border-color: var(--c-ink); color: var(--c-bg); }
  .gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
  @media (min-width: 560px) { .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .work { position: relative; display: grid; gap: var(--sp-2); align-content: start; text-align: left; background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
  .work.featured { grid-column: span 2; }
  .work-img { position: relative; aspect-ratio: 1; max-width: 100%; width: 100%; border-radius: var(--r-md); overflow: hidden; background: var(--c-skel); transition: transform var(--dur-slow) var(--ease-out), box-shadow var(--dur-slow) var(--ease-out); }
  .work.featured .work-img { aspect-ratio: 2 / 1.15; }
  .work-img img, .work-img svg { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 900ms var(--ease-out); }
  .work-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgb(255 255 255 / .38) 48%, transparent 62%); transform: translateX(-110%); pointer-events: none; }
  .work:hover .work-img, .work:focus-visible .work-img { transform: translateY(-4px); box-shadow: var(--shadow-lift); }
  .work:hover .work-img img, .work:hover .work-img svg { transform: scale(1.06); }
  .work:hover .work-img::after { transform: translateX(110%); transition: transform 1s var(--ease-in-out); }
  .work-title { font-weight: 600; font-size: var(--fs-sm); line-height: 1.3; }
  .work-cat { font-size: var(--fs-xs); color: var(--c-muted); }
  .work .pill { position: absolute; top: var(--sp-2); left: var(--sp-2); z-index: 1; }

  /* ---------- Precios ---------- */
  .price-group { display: grid; gap: 0; }
  .price-group h3 { font-size: var(--fs-lg); font-style: italic; font-weight: 500; padding-bottom: var(--sp-2); }
  .price-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-1) var(--sp-3); padding-block: var(--sp-3); border-top: 1px solid var(--c-line); align-items: start; }
  .price-row .name { font-weight: 600; display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
  .price-row .desc { font-size: var(--fs-sm); color: var(--c-muted); }
  .price-row .amount { font-weight: 700; font-size: var(--fs-lg); text-align: right; white-space: nowrap; }
  .price-row .dur { font-size: var(--fs-xs); color: var(--c-muted); }
  .price-row .btn { grid-column: 2; justify-self: end; }
  .desde { font-size: var(--fs-xs); font-weight: 600; color: var(--c-muted); }
  .variants { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: var(--sp-1) 0 0; padding: 0; }
  .vchip {
    display: inline-flex; gap: 6px; align-items: baseline; min-height: 36px; padding: 0 var(--sp-3); border-radius: var(--r-pill);
    border: 1.5px solid var(--c-line); background: var(--c-surface); color: var(--c-ink); font: 600 var(--fs-xs) var(--f-body); cursor: pointer;
    transition: border-color var(--dur) var(--ease-out), transform var(--dur) var(--ease-spring), background var(--dur);
  }
  .vchip strong { color: var(--c-accent); }
  .vchip:hover, .vchip:focus-visible { border-color: var(--c-accent); background: var(--c-accent-soft); transform: translateY(-2px); }
  .vopts { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--sp-2); }
  .vopt { display: grid; place-items: center; gap: 0; min-height: 56px; padding: var(--sp-1); border: 1.5px solid var(--c-line); border-radius: var(--r-sm); background: var(--c-surface); font-weight: 700; cursor: pointer; text-align: center; transition: background var(--dur) var(--ease-out), color var(--dur), border-color var(--dur); }
  .vopt small { font-weight: 600; color: var(--c-muted); font-size: var(--fs-xs); }
  .vopt:hover { border-color: var(--c-muted); }
  .choice input:checked + .vopt { background: var(--c-ink); border-color: var(--c-ink); color: var(--c-bg); animation: pop 420ms var(--ease-spring); }
  .choice input:checked + .vopt small { color: var(--c-bg); }
  .choice input:focus-visible + .vopt { outline: 3px solid var(--c-focus); outline-offset: 2px; }
  .leader { display: none; }
  .policy { background: var(--c-gloss-soft); border-radius: var(--r-md); padding: var(--sp-4); display: grid; gap: var(--sp-2); font-size: var(--fs-sm); }
  .policy h3 { font-size: var(--fs-lg); font-style: italic; font-weight: 500; }

  /* ---------- Turnos ---------- */
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  legend { font-weight: 700; padding: 0; margin-bottom: var(--sp-2); }
  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--sp-1); }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .day {
    display: grid; justify-items: center; gap: 2px; padding: var(--sp-2) 2px; min-height: 76px;
    border: 1.5px solid var(--c-line); border-radius: var(--r-md); background: var(--c-surface); cursor: pointer; text-align: center;
    transition: background var(--dur) var(--ease-out), color var(--dur), border-color var(--dur), transform var(--dur-fast);
  }
  .day .dow { font-size: var(--fs-xs); color: var(--c-muted); text-transform: capitalize; }
  .day .dnum { font-family: var(--f-display); font-size: var(--fs-xl); font-weight: 600; line-height: 1; }
  .day .free { font-size: 11px; font-weight: 600; color: var(--c-ok); }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--sp-2); }
  .slot { display: grid; place-items: center; min-height: var(--tap); border: 1.5px solid var(--c-line); border-radius: var(--r-sm); background: var(--c-surface); font-weight: 600; cursor: pointer; transition: background var(--dur) var(--ease-out), color var(--dur), border-color var(--dur); }
  .day:hover, .slot:hover { border-color: var(--c-muted); }
  .choice input:checked + .day, .choice input:checked + .slot { background: var(--c-ink); border-color: var(--c-ink); color: var(--c-bg); animation: pop 420ms var(--ease-spring); }
  .choice input:checked + .day .dow, .choice input:checked + .day .free { color: var(--c-bg); }
  .choice input:focus-visible + .day, .choice input:focus-visible + .slot { outline: 3px solid var(--c-focus); outline-offset: 2px; }
  .choice input:disabled + .day { opacity: .45; cursor: not-allowed; }
  .choice input:disabled + .day .free { color: var(--c-muted); }
  .empty { padding: var(--sp-5); border: 1.5px dashed var(--c-line); border-radius: var(--r-md); text-align: center; color: var(--c-muted); display: grid; gap: var(--sp-3); justify-items: center; }
  .cta-bar { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); padding-top: var(--sp-2); z-index: 5; }
  .cta-bar .btn.ready { animation: glow 1.4s var(--ease-out) 1; }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c-accent) 55%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }

  /* ---------- Formulario de reserva ---------- */
  .summary { display: grid; gap: 2px; padding: var(--sp-3) var(--sp-4); background: var(--c-accent-soft); border-radius: var(--r-md); }
  .summary strong { font-family: var(--f-display); font-size: var(--fs-lg); font-weight: 600; text-transform: capitalize; }
  .extras { display: grid; gap: var(--sp-2); }
  .extra { display: flex; align-items: center; gap: var(--sp-3); min-height: var(--tap); padding: var(--sp-2) var(--sp-3); border: 1.5px solid var(--c-line); border-radius: var(--r-sm); cursor: pointer; transition: border-color var(--dur), background var(--dur); }
  .extra input { width: 20px; height: 20px; accent-color: var(--c-accent); flex: none; }
  .extra:has(input:checked) { border-color: var(--c-accent); background: var(--c-accent-soft); }
  .extra span:nth-child(2) { flex: 1; min-width: 0; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding-top: var(--sp-2); border-top: 1px dashed var(--c-line); }
  .total strong { font-family: var(--f-display); font-size: var(--fs-xl); }
  .check-line { display: flex; gap: var(--sp-2); align-items: center; min-height: var(--tap); font-size: var(--fs-sm); }
  .check-line input { width: 20px; height: 20px; accent-color: var(--c-accent); }

  /* ---------- Éxito ---------- */
  .success { display: grid; gap: var(--sp-3); text-align: center; justify-items: center; }
  .success svg.tick { width: 72px; height: 72px; }
  .success .tick circle { stroke-dasharray: 190; stroke-dashoffset: 190; animation: draw 700ms var(--ease-out) forwards; }
  .success .tick path { stroke-dasharray: 50; stroke-dashoffset: 50; animation: draw 450ms var(--ease-out) 550ms forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .copy-row { display: flex; gap: var(--sp-2); align-items: center; justify-content: center; flex-wrap: wrap; font-size: var(--fs-sm); }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }

  /* ---------- Visor de trabajos ---------- */
  .viewer { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: var(--r-md); overflow: hidden; background: var(--c-skel); touch-action: pan-y; }
  .viewer > * { width: 100%; height: 100%; object-fit: cover; }
  .viewer .slide-r { animation: panel-r 420ms var(--ease-out); }
  .viewer .slide-l { animation: panel-l 420ms var(--ease-out); }
  .viewer-nav { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }

  /* ---------- Estudio: mapa ---------- */
  .map { position: relative; border-radius: var(--r-md); overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; background: var(--c-map-land); border: 1px solid var(--c-line); }
  .map svg.streets { width: 100%; height: 100%; display: block; }
  .map iframe { width: 100%; height: 100%; border: 0; display: block; animation: fade-in var(--dur-slow) var(--ease-out); }
  .pin { position: absolute; left: 50%; top: 50%; width: 34px; height: 44px; margin: -44px 0 0 -17px; animation: pin-drop 900ms var(--ease-spring) 300ms backwards; }
  .pin::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 14px; height: 6px; margin-left: -7px; border-radius: 50%; background: rgb(0 0 0 / .18); }
  .pin-ring { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; color: var(--c-accent); animation: pulse-ring 1.8s var(--ease-out) 1.2s infinite; }
  @keyframes pin-drop { from { opacity: 0; transform: translateY(-60px); } }
  .map-load { position: absolute; right: var(--sp-2); bottom: var(--sp-2); }
  .address { display: grid; gap: 2px; }
  .address strong { font-size: var(--fs-md); }
  .row { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }

  /* Horario */
  .hours { display: grid; }
  .hours div { display: flex; justify-content: space-between; gap: var(--sp-3); padding-block: var(--sp-2); border-top: 1px solid var(--c-line); font-size: var(--fs-sm); text-transform: capitalize; }
  .hours div:first-child { border-top: 0; }
  .hours .today { font-weight: 700; color: var(--c-accent); }

  /* Reseñas */
  .rating-big { display: flex; align-items: center; gap: var(--sp-4); }
  .rating-big .score { font-family: var(--f-display); font-size: 3rem; line-height: 1; }
  .stars { --pct: 0%; position: relative; display: inline-block; font-size: 1.25rem; letter-spacing: 2px; color: var(--c-line); line-height: 1; }
  .stars::before { content: "★★★★★"; }
  .stars::after { content: "★★★★★"; position: absolute; left: 0; top: 0; width: var(--pct); overflow: hidden; color: var(--c-gloss); animation: stars-fill 1.2s var(--ease-out) 200ms backwards; white-space: nowrap; }
  @keyframes stars-fill { from { width: 0; } }
  .reviews { display: grid; grid-auto-flow: column; grid-auto-columns: min(82%, 300px); gap: var(--sp-3); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: var(--sp-2); scrollbar-width: thin; }
  .review { scroll-snap-align: start; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-md); padding: var(--sp-4); display: grid; gap: var(--sp-2); align-content: start; }
  .review .stars { font-size: var(--fs-sm); }
  .review p { font-size: var(--fs-sm); }
  .star-input { display: flex; gap: var(--sp-1); flex-direction: row-reverse; justify-content: flex-end; }
  .star-input input { position: absolute; opacity: 0; }
  .star-input label { font-size: 2rem; line-height: 1; color: var(--c-line); cursor: pointer; padding: 4px; transition: transform var(--dur) var(--ease-spring), color var(--dur-fast); }
  .star-input label:hover, .star-input label:hover ~ label, .star-input input:checked ~ label { color: var(--c-gloss); }
  .star-input label:hover { transform: scale(1.2) rotate(-8deg); }
  .star-input input:focus-visible + label { outline: 3px solid var(--c-focus); border-radius: var(--r-sm); }

  /* Tarjeta de sellos */
  .loyalty { background: linear-gradient(140deg, var(--c-ink), color-mix(in srgb, var(--c-ink) 80%, var(--c-accent))); color: var(--c-bg); border-radius: var(--r-lg); padding: var(--sp-5); display: grid; gap: var(--sp-4); position: relative; overflow: hidden; }
  .loyalty::before { content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c-gloss) 45%, transparent), transparent 70%); }
  .loyalty h3 { font-size: var(--fs-xl); font-style: italic; font-weight: 500; }
  .loyalty .muted { color: color-mix(in srgb, var(--c-bg) 75%, transparent); }
  .loyalty .input { background: color-mix(in srgb, var(--c-bg) 10%, transparent); border-color: color-mix(in srgb, var(--c-bg) 30%, transparent); color: var(--c-bg); }
  .loyalty label { color: var(--c-bg); }
  .stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: var(--sp-2); max-width: 360px; }
  .stamp { aspect-ratio: 1; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--c-bg) 40%, transparent); display: grid; place-items: center; }
  .stamp.on { border: 0; background: var(--c-gloss); animation: stamp 520ms var(--ease-spring) backwards; animation-delay: calc(var(--i) * 110ms); }
  .stamp svg { width: 55%; height: 55%; }
  @keyframes stamp { from { opacity: 0; transform: scale(1.8) rotate(-25deg); } }
  .loyalty .error-text { color: var(--c-gloss); }

  /* Preguntas */
  .faq details { border-top: 1px solid var(--c-line); }
  .faq details:last-child { border-bottom: 1px solid var(--c-line); }
  .faq summary { list-style: none; display: flex; justify-content: space-between; gap: var(--sp-3); align-items: center; min-height: var(--tap); padding-block: var(--sp-3); font-weight: 600; cursor: pointer; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; font-size: 1.4rem; color: var(--c-accent); transition: transform var(--dur) var(--ease-spring); }
  .faq details[open] summary::after { transform: rotate(45deg); }
  .faq details::details-content { block-size: 0; overflow: clip; transition: block-size var(--dur) var(--ease-out), content-visibility var(--dur) allow-discrete; }
  .faq details[open]::details-content { block-size: auto; }
  .faq .ans { padding-bottom: var(--sp-3); color: var(--c-muted); font-size: var(--fs-sm); }

  /* ---------- Barra inferior con indicador deslizante ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: color-mix(in srgb, var(--c-surface) 88%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--c-line);
    padding: var(--sp-2) var(--sp-3) calc(var(--sp-2) + env(safe-area-inset-bottom, 0px));
  }
  .tabbar-inner { position: relative; max-width: var(--w-page); margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-1); }
  .tab-ind { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: var(--r-md); background: var(--c-accent-soft); transition: transform 520ms var(--ease-spring), width 520ms var(--ease-spring); }
  .tab {

          variantes: [{ nombre: 'Solo en el pulgar', precio: 1000 }, { nombre: 'En todas las uñas', precio: 1200 }] },
        { id: 3, nombre: 'Pedicura con base rubber', categoria: 'Pies', precio: 1000, duracion: 0, descripcion: 'Limpieza de cutículas e hidratación, más aplicación de base rubber.', popular: 0, extra: 0, variantes: [] },

        { id: 4, titulo: 'Negro con destellos', categoria: 'Diseños', forma: 'almendra', color: '#1E1A1D', deco: 'puntos' },
        { id: 5, titulo: 'Coral de verano', categoria: 'Pies', forma: 'cuadrada', color: '#F0735A' },

      dias,

  }

  // ---------- Formato ----------
  const moneda = () => state.data?.ajustes.moneda || 'CUP';
  const fmtPrecio = n => new Intl.NumberFormat('es-CU').format(n) + ' ' + moneda();
  const fecha = iso => new Date(iso + 'T12:00:00');
  const fmtDia = (iso, opts) => fecha(iso).toLocaleDateString('es', opts);
  const fmtDur = m => m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}` : `${m} min`;
  const hora12 = h => { const [H, M] = h.split(':').map(Number); return `${((H + 11) % 12) + 1}:${String(M).padStart(2, '0')} ${H < 12 ? 'a. m.' : 'p. m.'}`; };
  const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const splitLetters = (txt, start = 0) => [...txt].map((ch, i) => ch === ' ' ? ' ' : `<span class="l" style="--i:${start + i}">${esc(ch)}</span>`).join('');

  // ---------- Ilustraciones ----------
  function nailArt(w, big) {
    const forms = {
      almendra: x => `M${x} 96V46C${x} 20 ${x + 12} 4 ${x + 18} 0C${x + 24} 4 ${x + 36} 20 ${x + 36} 46V96Z`,
      coffin: x => `M${x} 96V28L${x + 8} 0H${x + 28}L${x + 36} 28V96Z`,

    const f = forms[w.forma] || forms.almendra; const id = 'g' + w.id + (big ? 'b' : '');

  // ---------- Horario ----------
  function estadoAbierto() {
    const { horario } = state.data.ajustes; const { dow, hora } = state.data.ahora;
    const hoy = horario?.[dow];
    if (!horario) return null;
    if (hoy?.abierto && hora >= hoy.abre && hora < hoy.cierra) return { abierto: true, texto: `Abierta · cierra ${hora12(hoy.cierra)}` };
    if (hoy?.abierto && hora < hoy.abre) return { abierto: false, texto: `Cerrada · abre hoy ${hora12(hoy.abre)}` };

      const d = horario[(dow + i) % 7];

  async function load() {

  // ---------- Formulario de reserva ----------
  function totalActual() {
    const s = state.data.servicios; const base = s.find(x => x.id === state.servicioId);
    const vars = base?.variantes || []; const v = vars[state.variante];
    const ex = s.filter(x => state.extras.has(x.id));
    return { precio: (v ? v.precio : base?.precio || 0) + ex.reduce((t, e) => t + e.precio, 0), dur: (base?.duracion || 0) + ex.reduce((t, e) => t + e.duracion, 0), falta: vars.length > 0 && !v };
  }
  function animarNumero(el, hasta) {
    const desde = Number(el.dataset.v || 0); el.dataset.v = hasta;
    if (reduced || desde === hasta) { el.textContent = fmtPrecio(hasta); return; }
    const t0 = performance.now(); const D = 450;
    const tick = t => { const k = Math.min(1, (t - t0) / D); const e = 1 - Math.pow(1 - k, 3); el.textContent = fmtPrecio(Math.round(desde + (hasta - desde) * e)); if (k < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }

  function comprimirFoto(file, max = 1400) {
    return new Promise((resolve, reject) => {
      if (!/^image\//.test(file.type)) return reject(new Error('Elige una foto (JPG, PNG o WEBP).'));
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        let out = c.toDataURL('image/webp', .82);
        if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', .85);
        resolve(out);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la foto. Prueba con otra.')); };
      img.src = url;
    });
  }

    return true;

  async function submitBook(e) {
    e.preventDefault();
    const pago = pagoRequerido();
    if (pago && $('#paso2').hidden) return irAlPago();    // Enter en el paso 1 lleva al pago
    if (!validarPaso1()) { if (pago) { $('#paso2').hidden = true; $('#paso1').hidden = false; } return; }
    const f = e.target.elements;
    const body = {
      turno_id: state.turno.id, servicio_id: Number(f.servicio.value), variante: state.variante, extras: [...state.extras],
      nombre: f.nombre.value.trim(), telefono: f.telefono.value.trim(), notas: f.notas.value.trim(), web: f.web.value,
    };
    if (pago) {
      if (!state.comp) { $('#e-comprobante').textContent = 'Sube la foto del comprobante de la transferencia.'; marcar($('#f-comp'), true); $('#f-comp').focus(); return; }
      body.comprobante = state.comp; body.transaccion = f.transaccion.value.trim();
    }
    if ($('#f-recordar').checked) store.set('clienta', { nombre: body.nombre, telefono: body.telefono }); else store.del('clienta');
    $('#e-general').textContent = '';
    const btn = $('#enviar'); const txt = btn.textContent; btn.disabled = true; btn.textContent = 'Enviando…';
    const fallo = msg => { $('#e-general').textContent = msg; btn.disabled = false; btn.textContent = txt; };
    let res;
    try {
      if (state.demo) {
        await new Promise(r => setTimeout(r, 800));
        const s = state.data.servicios.find(x => x.id === body.servicio_id); const t = totalActual(); const v = (s.variantes || [])[state.variante];
        res = { fecha: state.dia, hora: state.turno.hora, servicio: s.nombre + (v ? ' · ' + v.nombre : ''), extras: state.data.servicios.filter(x => state.extras.has(x.id)).map(x => x.nombre),
          precio: t.precio, sena: pago ? senaDe(t.precio) : 0, pago: pago ? 'por_verificar' : 'sin_pago', duracion: t.dur };
      } else {
        const r = await fetch('/api/reservas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const j = await r.json().catch(() => ({ error: 'Respuesta inesperada del servidor. Intenta de nuevo.' }));
        if (!r.ok) {
          const enPaso1 = ['nombre', 'telefono', 'servicio', 'variante'].includes(j.campo);
          if (enPaso1 && pago) { $('#paso2').hidden = true; $('#paso1').hidden = false; }
          if (j.campo && $('#e-' + j.campo)) { $('#e-' + j.campo).textContent = j.error; marcar(j.campo === 'comprobante' ? $('#f-comp') : f[j.campo], true); btn.disabled = false; btn.textContent = txt; }
          else fallo(j.error || 'No se pudo enviar. Intenta de nuevo.');
          if (r.status === 409) { state.turno = null; reloadSilently(); $('#e-general').textContent += ' Cierra esta ventana y elige otra hora.'; }
          return;
        }
        res = j;
      }

    const d = state.data.dias.find(x => x.fecha === res.fecha); if (d) d.turnos = d.turnos.filter(t => t.id !== body.turno_id);
    state.turno = null; state.nota = ''; state.extras.clear(); state.variante = null; state.comp = null;
    showSuccess(res, body);
    renderBooking(); renderHero();
  }

  // ---------- Confeti de gotas de esmalte ----------
  function confetti() {
    if (reduced) return;
    const cv = $('#confetti'); const ctx = cv.getContext('2d'); if (!ctx) return; cv.hidden = false;
    const dpr = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const cs = getComputedStyle(document.documentElement);
    const colores = ['--c-accent', '--c-gloss', '--c-accent-soft', '--c-ok'].map(v => cs.getPropertyValue(v).trim());
    const P = Array.from({ length: 70 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .38, vx: (Math.random() - .5) * 9, vy: -Math.random() * 11 - 4, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, w: 5 + Math.random() * 4, h: 9 + Math.random() * 7, c: colores[Math.floor(Math.random() * colores.length)] }));
    const t0 = performance.now();
    const frame = t => {
      const k = (t - t0) / 1700; ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const p of P) {
        p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.moveTo(-p.w / 2, p.h / 2); ctx.lineTo(-p.w / 2, -p.h / 6); ctx.quadraticCurveTo(0, -p.h, p.w / 2, -p.h / 6); ctx.lineTo(p.w / 2, p.h / 2); ctx.closePath(); ctx.fill(); ctx.restore();
      }
      if (k < 1) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
    };
    requestAnimationFrame(frame);
  }

  function moveIndicator() {
    const b = $(`[role="tab"][data-tab="${state.tab}"]`); const ind = $('#tabInd'); if (!b) return;

  }
  function setTab(tab, focus) {
    const prev = TABS.indexOf(state.tab); const next = TABS.indexOf(tab);
    state.tab = tab;
    $$('[role="tab"]').forEach(b => {
      const on = b.dataset.tab === tab; const p = $('#' + b.getAttribute('aria-controls'));
      b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; p.hidden = !on;
      p.classList.remove('enter-r', 'enter-l');
      if (on && prev !== next) { void p.offsetWidth; p.classList.add(next > prev ? 'enter-r' : 'enter-l'); }
      if (on && focus) b.focus();
    });
    moveIndicator();
    try { history.replaceState(null, '', '#' + tab); } catch {}
    const hero = $('#hero'); const top = hero.offsetTop + hero.offsetHeight - 8;
    if (scrollY > top) window.scrollTo({ top, behavior: reduced ? 'auto' : 'smooth' });
  }

  function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = true; void el.offsetWidth; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2800); }

  document.addEventListener('click', async e => {

    if (t.hasAttribute('data-close')) { t.closest('dialog').close(); return; }
    if (t.dataset.tab) setTab(t.dataset.tab);

      setTab(t.dataset.goto);

    }

    else if (t.dataset.work) { showWork(Number(t.dataset.work)); $('#workDialog').showModal(); }
    else if (t.id === 'prevWork') showWork(state.workIdx - 1, 'l');
    else if (t.id === 'nextWork') showWork(state.workIdx + 1, 'r');
    else if (t.id === 'wantThis') { state.nota = `Quiero el diseño "${state.lista[state.workIdx].titulo}".`; $('#workDialog').close(); setTab('turnos'); toast('Elige día y hora. Tu diseño quedó anotado.'); }

      setTab('turnos');
      const s = state.data.servicios.find(x => x.id === state.servicioId); const v = (s?.variantes || [])[state.variante];
      toast(`${s.nombre}${v ? ' · ' + v.nombre : ''} elegido. Ahora el día y la hora.`);
    }
    else if (t.id === 'continuar') { if (!state.turno) { live('Primero elige una hora.'); $('input[name="turno"]')?.focus(); return; } openBook(); }
    else if (t.id === 'openReview') openReview();
    else if (t.id === 'irPago') irAlPago();
    else if (t.id === 'volverPaso1') { $('#paso2').hidden = true; $('#paso1').hidden = false; $('#bookDialogTitle').textContent = 'Paso 1 de 2 · Tus datos'; $('#irPago').focus(); }
    else if (t.id === 'loadMap') {
      const a = state.data.ajustes; const la = Number(a.lat), lo = Number(a.lng), d = .004;
      $('#map').innerHTML = `<iframe title="Mapa interactivo de ${esc(a.nombre)}" loading="lazy" referrerpolicy="no-referrer" src="https://www.openstreetmap.org/export/embed.html?bbox=${lo - d},${la - d * .6},${lo + d},${la + d * .6}&layer=mapnik&marker=${la},${lo}"></iframe>`;
    }
    else if (t.dataset.copy) {
      const el = $(t.dataset.copy); const txt = t.dataset.copyRaw || (el.textContent + (t.dataset.copyExtra || ''));
      try { await navigator.clipboard.writeText(txt); toast('Copiado'); }
      catch { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto seleccionado. Cópialo.'); }
    }
  });

  document.addEventListener('change', e => {
    const n = e.target.name;
    if (n === 'dia') {
      state.dia = e.target.value; state.turno = null;
      const dia = state.data.dias.find(d => d.fecha === state.dia);
      $('#slots').innerHTML = slotsHtml(dia); const s = $('#slots'); s.classList.remove('stagger'); void s.offsetWidth; s.classList.add('stagger');
      $('legend span', $('#slots').closest('fieldset')).textContent = '· ' + fmtDia(state.dia, { weekday: 'long', day: 'numeric' });
      const b = $('#continuar'); b.setAttribute('aria-disabled', 'true'); b.classList.remove('ready'); b.textContent = ctaText();
    }
    if (n === 'turno') {
      state.turno = state.data.dias.find(d => d.fecha === state.dia).turnos.find(x => String(x.id) === e.target.value);
      const b = $('#continuar'); b.removeAttribute('aria-disabled'); b.textContent = ctaText(); b.classList.remove('ready'); void b.offsetWidth; b.classList.add('ready');
    }
    if (e.target.id === 'f-servicio') { state.servicioId = Number(e.target.value); state.variante = null; $('#varBox').innerHTML = variantesHtml(); actualizarTotal(); }
    if (n === 'variante') { state.variante = Number(e.target.value); $('#e-variante').textContent = ''; actualizarTotal(); }
    if (e.target.id === 'f-comp' && e.target.files[0]) {
      const prev = $('#compPrev'); $('#e-comprobante').textContent = ''; marcar(e.target, false);
      comprimirFoto(e.target.files[0]).then(d => {
        if (d.length > 4_000_000) throw new Error('La foto sigue siendo muy pesada. Usa una captura de pantalla.');
        state.comp = d; prev.src = d; prev.hidden = false; live('Comprobante listo para enviar');
      }).catch(er => { state.comp = null; prev.hidden = true; $('#e-comprobante').textContent = er.message; marcar(e.target, true); });
    }
    if (n === 'extra') { const id = Number(e.target.value); e.target.checked ? state.extras.add(id) : state.extras.delete(id); actualizarTotal(); }
  });
  document.addEventListener('submit', e => {
    if (e.target.id === 'bookForm') submitBook(e);
    if (e.target.id === 'loyaltyForm') consultarSellos(e);
    if (e.target.id === 'reviewForm') submitReview(e);
  });

  // Visor: flechas del teclado y deslizar con el dedo
  $('#workDialog').addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); showWork(state.workIdx + 1, 'r'); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); showWork(state.workIdx - 1, 'l'); }
  });
  let x0 = null;
  $('#viewer').addEventListener('pointerdown', e => { x0 = e.clientX; });
  $('#viewer').addEventListener('pointerup', e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 40) showWork(state.workIdx + (dx < 0 ? 1 : -1), dx < 0 ? 'r' : 'l'); });

  // Pestañas: flechas, Inicio y Fin (patrón ARIA)
  $('#tablist').addEventListener('keydown', e => {
    const tabs = $$('[role="tab"]'); const i = tabs.indexOf(document.activeElement); if (i < 0) return;
    const n = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i - 1 + tabs.length) % tabs.length, Home: 0, End: tabs.length - 1 }[e.key];
    if (n !== undefined) { e.preventDefault(); setTab(tabs[n].dataset.tab, true); }
  });
  addEventListener('resize', moveIndicator);

  const inicial = (location.hash || '').slice(1);
  if (TABS.includes(inicial)) setTab(inicial); else moveIndicator();
  load();
})();
</script>
